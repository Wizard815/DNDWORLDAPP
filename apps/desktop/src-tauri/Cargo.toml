# See all the options at https://v2.tauri.app/start/

[package]
name = "dndworldapp-desktop"
version = "0.0.1"
description = "DNDWORLDAPP Desktop Companion"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dndworldapp_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build]
target = "x86_64-unknown-linux-gnu"

[[bin]]
name = "dndworldapp-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
